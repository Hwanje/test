<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키오스크 연습장</title>
<style>
  /* ===== 디자인 시스템 (CLAUDE.md 수치 고정) ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 22px;               /* 본문 */
    color: #1A1A1A;
    background: #FFFFFF;
  }
  button {
    font-family: inherit;
    color: #1A1A1A;
    min-height: 80px;              /* 버튼 최소 높이 */
    border-radius: 16px;           /* 모서리 */
    cursor: pointer;
  }

  /* ===== 화면 전환 ===== */
  .screen { display: none; height: 100%; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== 우측 상단 조절 단추: 글씨 크기 + 소리 =====
     --scale 은 도우미 UI에만 적용한다. 키오스크 안 글씨는 고정(현실 재현). */
  :root { --scale: 1; }
  #top-controls {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
    max-width: 70vw;
  }
  #btn-sound {
    font-size: 22px; font-weight: 700; padding: 0 20px;
    background: #FFFFFF; color: #1F6FEB; border: 3px solid #1F6FEB;
  }
  .size-btn {
    width: 76px; font-weight: 700;
    background: #FFFFFF; color: #1F6FEB; border: 3px solid #1F6FEB;
  }
  .size-btn.selected { background: #1F6FEB; color: #FFFFFF; }
  #btn-size-small { font-size: 20px; }
  #btn-size-mid   { font-size: 26px; }
  #btn-size-large { font-size: 32px; }

  /* ===== 힌트 (허용된 유일한 애니메이션: 힌트 반짝임) ===== */
  @keyframes hintBlink {
    0%, 100% { box-shadow: 0 0 0 0 rgba(31, 111, 235, 0); }
    50%      { box-shadow: 0 0 0 8px rgba(31, 111, 235, 0.55); }
  }
  .hint-blink {
    animation: hintBlink 1.2s ease-in-out infinite;
    border-color: #1F6FEB !important;
  }
  .here-anchor { position: relative; }
  .here-hint {
    position: absolute; top: 4px; right: 4px;
    background: #1F6FEB; color: #FFFFFF;
    font-size: 22px; font-weight: 700;
    padding: 4px 12px; border-radius: 16px;
    pointer-events: none;
  }

  /* ===== 홈 화면 (바깥 = 배려: 크고 친절하게) ===== */
  #screen-home { padding: 112px 24px 24px; gap: 16px; }
  #screen-home h1 { font-size: calc(38px * var(--scale)); text-align: center; margin: 24px 0 8px; }
  #screen-home p  { text-align: center; margin-bottom: 16px; font-size: calc(22px * var(--scale)); }
  .home-card {
    display: block; width: 100%; min-height: 160px;
    font-size: calc(28px * var(--scale)); font-weight: 700;
    background: #FFFFFF; border: 3px solid #1F6FEB; color: #1F6FEB;
  }
  .home-card:disabled {
    border-color: #767676; color: #767676; cursor: default;
  }
  .home-card .card-sub { display: block; font-size: calc(22px * var(--scale)); font-weight: 400; margin-top: 8px; }
  /* 연습하기 / 혼자 해보기 선택 */
  #mode-question { text-align: center; margin-bottom: 0; }
  #mode-row { display: flex; gap: 16px; }
  .mode-btn {
    flex: 1; font-size: calc(26px * var(--scale)); font-weight: 700;
    background: #FFFFFF; color: #1F6FEB; border: 3px solid #1F6FEB;
  }
  .mode-btn.selected { background: #1F6FEB; color: #FFFFFF; }

  /* ===== 연습 화면 ===== */
  #screen-practice { height: 100%; }
  /* 상단 진행 표시 */
  #progress-bar {
    min-height: 96px; display: flex; align-items: center;
    padding: 8px 200px 8px 24px;      /* 우측은 소리 단추 자리 */
    font-size: calc(22px * var(--scale)); font-weight: 700;
    background: #FFFFFF; border-bottom: 2px solid #1A1A1A;
  }

  /* --- 안쪽 = 현실 재현: 실제 키오스크처럼 무뚝뚝하고 빽빽하게 --- */
  #kiosk-area {
    flex: 2; overflow-y: auto;
    background: #FFFFFF;
    padding: 16px 24px;
    display: flex; flex-direction: column;
  }
  #kiosk-frame {
    flex: 1; display: flex; flex-direction: column;
    border: 4px solid #1A1A1A; border-radius: 16px; overflow: hidden;
  }
  #kiosk-header {
    background: #1A1A1A; color: #FFFFFF;
    font-size: 22px; padding: 10px 16px;
  }
  #kiosk-body { flex: 1; padding: 16px; overflow-y: auto; }
  #kiosk-title { font-size: 28px; font-weight: 700; margin-bottom: 16px; }
  .kiosk-btn {
    font-size: 28px;               /* 키오스크 버튼 */
    background: #FFFFFF; border: 2px solid #1A1A1A;
    width: 100%;
  }
  .kiosk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .kiosk-list { display: flex; flex-direction: column; gap: 16px; }
  /* 숫자판 */
  .keypad-display {
    font-size: 38px; letter-spacing: 8px; text-align: center;
    border: 2px solid #1A1A1A; border-radius: 16px;
    min-height: 80px; line-height: 76px; margin-bottom: 16px;
  }
  .keypad-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  /* 확인/완료 안내문 */
  .kiosk-message { font-size: 28px; line-height: 1.5; margin-bottom: 16px; }

  /* 혼자 해보기: 안내 문구와 [다시 듣기]를 숨긴다 ([처음으로]는 남김) */
  #screen-practice.solo #guide-text,
  #screen-practice.solo #btn-repeat { display: none; }

  /* ===== 체험 모드: 어르신이 겪는 화면 그대로 =====
     (카운트다운 금지 규칙의 유일한 예외 구역이다) */
  #demo-timer, #demo-queue { display: none; }
  .demo #progress-bar, .demo #helper-area { display: none; }
  .demo #demo-timer {
    display: block; text-align: center; padding: 12px;
    font-size: 26px; font-weight: 700; color: #C2410C;
    border-bottom: 2px solid #1A1A1A;
  }
  .demo #demo-timer.urgent {
    font-size: 38px;
    animation: demoBlink 0.6s step-start infinite;
  }
  @keyframes demoBlink { 50% { opacity: 0.15; } }
  .demo #demo-queue {
    display: block; text-align: center; padding: 16px;
    font-size: 22px; border-top: 2px solid #1A1A1A;
  }
  #demo-queue .queue-icons { letter-spacing: 4px; }
  /* 체험 모드 키오스크: 실제처럼 작고 빽빽한 글씨 */
  .demo #kiosk-header { font-size: 14px; }
  .demo #kiosk-title { font-size: 16px; margin-bottom: 8px; }
  .demo .kiosk-btn { font-size: 15px; min-height: 44px; }
  .demo .kiosk-grid, .demo .keypad-grid { gap: 8px; }
  .demo .kiosk-message { font-size: 15px; }
  .demo .keypad-display {
    font-size: 16px; min-height: 44px; line-height: 42px; letter-spacing: 4px;
  }

  /* 체험 뒤 전환 화면 */
  #screen-demo-end {
    justify-content: center; align-items: center;
    padding: 24px; gap: 16px; text-align: center;
  }
  #screen-demo-end h1 { font-size: calc(38px * var(--scale)); }
  #screen-demo-end p { font-size: calc(26px * var(--scale)); line-height: 1.5; }
  #screen-demo-end button {
    width: 100%; max-width: 480px; font-size: calc(28px * var(--scale)); font-weight: 700;
    background: #1F6FEB; color: #FFFFFF; border: none;
  }
  .demo-card { border-color: #C2410C !important; color: #C2410C !important; }

  /* 어려운 말: 점선 밑줄 + 옅은 노란 배경 */
  .gloss {
    text-decoration: underline dotted 2px;
    text-underline-offset: 4px;
    background: #FFF4C2;
    border-radius: 4px;
    cursor: pointer;
  }
  /* 말풍선: 화면 아래에 크게. 떠 있어도 연습은 계속된다 */
  #gloss-bubble {
    display: none;
    position: fixed; left: 16px; right: 16px; bottom: 16px; z-index: 20;
    background: #FFFFFF; border: 4px solid #1F6FEB; border-radius: 16px;
    padding: 16px; box-shadow: 0 8px 24px rgba(26, 26, 26, 0.25);
  }
  #gloss-bubble.open { display: block; }
  #gloss-word { font-size: calc(28px * var(--scale)); font-weight: 700; margin-bottom: 8px; }
  #gloss-easy { font-size: calc(26px * var(--scale)); line-height: 1.5; }
  #gloss-detail { font-size: calc(22px * var(--scale)); line-height: 1.5; margin-top: 8px; }
  .gloss-buttons { display: flex; gap: 16px; margin-top: 16px; }
  .gloss-buttons button {
    flex: 1; font-size: calc(26px * var(--scale)); font-weight: 700;
    background: #1F6FEB; color: #FFFFFF; border: none;
  }
  .gloss-buttons #btn-gloss-close {
    background: #FFFFFF; color: #1F6FEB; border: 3px solid #1F6FEB;
  }

  /* --- 바깥 = 배려: 도우미 영역 --- */
  #helper-area {
    flex: 1; display: flex; flex-direction: column;
    padding: 16px 24px; gap: 16px;
    border-top: 4px solid #1F6FEB;
    background: #FFFFFF;
  }
  #guide-text {
    flex: 1; font-size: calc(26px * var(--scale));      /* 도우미 안내 */
    line-height: 1.5; color: #1F6FEB; font-weight: 700;
  }
  #guide-text.wrong { color: #C2410C; } /* 주의색: 틀렸을 때 힌트 */
  .helper-buttons { display: flex; gap: 16px; }
  .helper-btn {
    flex: 1; font-size: calc(26px * var(--scale)); font-weight: 700;
    background: #1F6FEB; color: #FFFFFF; border: none;
  }
  .helper-btn.secondary {
    background: #FFFFFF; color: #1F6FEB; border: 3px solid #1F6FEB;
  }

  /* ===== 완료 화면 = 결과 카드 ===== */
  #screen-complete {
    align-items: center; overflow-y: auto;
    padding: 112px 24px 24px; gap: 16px; text-align: center;
  }
  #screen-complete h1 { font-size: calc(38px * var(--scale)); color: #0F7B3E; }
  #total-time { font-size: calc(38px * var(--scale)); font-weight: 700; }
  /* 혼자 해보기 완주: 축하만 크게, 기록·인쇄는 숨김 */
  #complete-sub { display: none; font-size: calc(26px * var(--scale)); line-height: 1.5; }
  #screen-complete.solo #complete-sub { display: block; }
  #screen-complete.solo #total-time,
  #screen-complete.solo #result-card,
  #screen-complete.solo #btn-print { display: none; }
  #screen-complete button {
    width: 100%; max-width: 480px; font-size: calc(28px * var(--scale)); font-weight: 700;
    background: #1F6FEB; color: #FFFFFF; border: none; flex-shrink: 0;
  }
  #screen-complete #btn-retry {
    background: #FFFFFF; color: #1F6FEB; border: 3px solid #1F6FEB;
  }

  /* 단계별 걸린 시간 막대 (CSS만 사용) */
  #result-card {
    width: 100%; max-width: 480px;
    border: 3px solid #1A1A1A; border-radius: 16px;
    padding: 16px; text-align: left;
  }
  .result-section-title { font-size: calc(26px * var(--scale)); font-weight: 700; margin-bottom: 12px; }
  .chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .chart-label { width: 92px; font-size: calc(22px * var(--scale)); flex-shrink: 0; }
  .chart-track { flex: 1; }
  .chart-bar { height: 32px; border-radius: 16px; background: #1F6FEB; }
  .chart-bar.hard { background: #C2410C; }
  .chart-sec { width: 64px; font-size: calc(22px * var(--scale)); text-align: right; flex-shrink: 0; }
  /* 어려웠던 곳 도움말 */
  #result-tips { margin-top: 16px; }
  .tip-line { font-size: calc(22px * var(--scale)); line-height: 1.6; }
  .tip-line strong { color: #C2410C; }

  /* ===== 인쇄용 순서표 (화면에서는 숨김) ===== */
  #print-sheet { display: none; }
  @media print {
    @page { size: A4 portrait; margin: 15mm; }
    /* 화면 요소(버튼·배경 포함)는 전부 숨기고 순서표만 남긴다 */
    body > :not(#print-sheet) { display: none !important; }
    body { background: #FFFFFF; }
    #print-sheet { display: block !important; color: #000000; }
    #print-sheet h1 {
      font-size: 26pt; text-align: center;
      margin: 0 0 6mm; padding-bottom: 4mm; border-bottom: 1pt solid #000000;
    }
    #print-sheet .sheet-sub { font-size: 13pt; text-align: center; margin-bottom: 8mm; }
    #print-sheet ol { font-size: 17pt; line-height: 1.7; padding-left: 14mm; margin: 0; }
    #print-sheet li { margin-bottom: 6mm; }
    #print-sheet li.hard { font-weight: 700; }
    #print-sheet li .care { display: block; font-size: 13pt; }
  }
</style>
</head>
<body>

<!-- 우측 상단: 글씨 크기(도우미 UI만) + 소리 켜기/끄기 -->
<div id="top-controls">
  <button id="btn-size-small" class="size-btn"></button>
  <button id="btn-size-mid" class="size-btn"></button>
  <button id="btn-size-large" class="size-btn"></button>
  <button id="btn-sound"></button>
</div>

<!-- 홈 화면 -->
<div id="screen-home" class="screen active">
  <h1 id="home-title"></h1>
  <p id="mode-question"></p>
  <div id="mode-row">
    <button id="btn-mode-practice" class="mode-btn"></button>
    <button id="btn-mode-solo" class="mode-btn"></button>
  </div>
  <p id="home-guide"></p>
  <button id="card-hospital" class="home-card"></button>
  <button id="card-cafe" class="home-card"></button>
  <button id="card-demo" class="home-card demo-card"></button>
</div>

<!-- 연습 화면 -->
<div id="screen-practice" class="screen">
  <div id="progress-bar"></div>
  <div id="demo-timer"></div>
  <div id="kiosk-area">
    <div id="kiosk-frame">
      <div id="kiosk-header"></div>
      <div id="kiosk-body"></div>
    </div>
  </div>
  <div id="demo-queue"></div>
  <div id="helper-area">
    <div id="guide-text"></div>
    <div class="helper-buttons">
      <button id="btn-repeat" class="helper-btn"></button>
      <button id="btn-home" class="helper-btn secondary"></button>
    </div>
  </div>
</div>

<!-- 완료 화면 = 결과 카드 -->
<div id="screen-complete" class="screen">
  <h1 id="complete-title"></h1>
  <div id="complete-sub"></div>
  <div id="total-time"></div>
  <div id="result-card">
    <div class="result-section-title" id="chart-title"></div>
    <div id="result-chart"></div>
    <div id="result-tips"></div>
  </div>
  <button id="btn-print"></button>
  <button id="btn-retry"></button>
</div>

<!-- 체험 뒤 전환 화면 -->
<div id="screen-demo-end" class="screen">
  <h1 id="demo-end-line1"></h1>
  <p id="demo-end-line2"></p>
  <p id="demo-end-line3"></p>
  <button id="btn-demo-end"></button>
</div>

<!-- 어려운 말 풀이 말풍선 -->
<div id="gloss-bubble">
  <div id="gloss-word"></div>
  <div id="gloss-easy"></div>
  <div id="gloss-detail"></div>
  <div class="gloss-buttons">
    <button id="btn-gloss-listen"></button>
    <button id="btn-gloss-close"></button>
  </div>
</div>

<!-- 인쇄용 순서표 (인쇄할 때만 보임) -->
<div id="print-sheet"></div>

<script>
'use strict';

/* ===== 사용자에게 보이는 모든 공통 문구 ===== */
const TEXT = {
  appTitle: '키오스크 연습장',
  homeGuide: '해볼 것을 골라 주세요.',
  modeQuestion: '어떻게 해볼까요?',
  modePractice: '연습하기',
  modeSolo: '혼자 해보기',
  hospitalCard: '병원 접수',
  hospitalCardSub: '무인 접수기',
  cafeCard: '카페 주문',
  cafeCardSub: '무인 주문기',
  soloCompleteTitle: '혼자서 해내셨어요!',
  soloCompleteSub: '도움 없이 처음부터 끝까지 해냈어요. 이제 진짜 기계 앞에서도 문제없어요.',
  demoCard: '먼저 체험해 보기',
  demoCardSub: '어르신은 이렇게 느낍니다',
  demoSeconds: n => n + '초',
  demoQueue: n => '뒤에 ' + n + '명이 기다리고 있습니다',
  demoEndLine1: '지금 조금 답답하셨나요?',
  demoEndLine2: '어르신은 매일 이 화면 앞에 서 있습니다.',
  demoEndLine3: '그래서 저희는 시간 제한을 없앴습니다.',
  demoEndBtn: '이제 연습해 볼까요',
  glossListen: '소리로 듣기',
  glossClose: '닫기',
  learnedTitle: '오늘 새로 배운 말',
  sizeSmall: '가-',
  sizeMid: '가',
  sizeLarge: '가+',
  progress: (now, total) => now + ' / ' + total + ' 단계',
  repeatBtn: '다시 듣기',
  homeBtn: '처음으로',
  keypadClear: '지우기',
  keypadOk: '확인',
  doneOk: '확인',
  completeTitle: '잘하셨어요',
  retryBtn: '다시 하기',
  soundOffBtn: '소리 끄기',   /* 켜져 있을 때 누르면 꺼짐 */
  soundOnBtn: '소리 켜기',    /* 꺼져 있을 때 누르면 켜짐 */
  hereHint: '여기예요',
  totalTime: (m, s) => (m > 0)
    ? '총 ' + m + '분 ' + s + '초 만에 끝냈어요'
    : '총 ' + s + '초 만에 끝냈어요',
  chartTitle: '단계마다 걸린 시간',
  stepLabel: n => n + '단계',
  secondsLabel: s => s + '초',
  tipsTitle: '다음엔 이렇게 하세요',
  noHardSteps: '막힌 곳 없이 아주 잘하셨어요.',
  printBtn: '이 순서표 인쇄하기',
  sheetTitleSuffix: ' 순서표',
  sheetSub: '지갑에 넣어 두고 하나씩 따라 하세요.',
  careMark: '★ 여기를 조심하세요'
};

/* ===== 어려운 말 풀이 사전 =====
   키오스크 화면 속 이 단어들에 밑줄이 생기고, 누르면 뜻을 알려준다 */
const GLOSSARY = {
  '수납': { easy: '진료비를 내는 것이에요',
            detail: '진료가 끝난 뒤에 돈을 내는 단계예요.' },
  '접수': { easy: '왔다고 알리는 것이에요',
            detail: '병원에 도착해서 이름을 올리는 첫 단계예요.' },
  '증명서': { easy: '병원이 써 주는 서류예요',
            detail: '진단서처럼 필요한 서류를 뽑는 거예요.' },
  '진료과': { easy: '아픈 곳을 보는 곳이에요',
            detail: '내과, 안과처럼 아픈 곳에 따라 나눈 곳이에요.' },
  '본인확인': { easy: '내가 맞는지 확인하는 것이에요',
            detail: '주민등록번호 같은 것으로 나를 확인하는 절차예요.' },
  '적립': { easy: '점수를 모으는 것이에요',
            detail: '살 때마다 점수를 모아 나중에 깎아 주는 거예요. 안 해도 돼요.' },
  '포장': { easy: '싸서 가져가는 것이에요',

/* ===== 음성 안내 (지원 안 되면 조용히 넘어가고 글만 보여준다) ===== */
function isSpeechSupported() {
  return typeof window !== 'undefined'
    && 'speechSynthesis' in window
    && typeof SpeechSynthesisUtterance !== 'undefined';
}

/* 한국어 음성 고르기: 기기에 내장된(localService) 음성 우선 */
function pickKoreanVoice() {
  try {
    const voices = window.speechSynthesis.getVoices();
    const korean = voices.filter(v =>
      (v.lang || '').replace('_', '-').toLowerCase().indexOf('ko') === 0);
    koreanVoice = korean.find(v => v.localService) || korean[0] || null;
  } catch (e) {
    koreanVoice = null;
  }
}

function speak(text) {
  if (soloMode || demoMode) return; // 혼자 해보기·체험: 음성 없음
  if (!soundOn || !isSpeechSupported()) return;
  try {
    if (!koreanVoice) pickKoreanVoice();
    if (!koreanVoice) return;   // 한국어 음성이 없으면 글만 보여준다
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.voice = koreanVoice;
    utter.lang = 'ko-KR';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  } catch (e) { /* 어떤 경우에도 소리 때문에 앱이 깨지지 않는다 */ }
}

function stopSpeech() {
  try { if (isSpeechSupported()) window.speechSynthesis.cancel(); } catch (e) {}
}

/* 첫 사용자 조작에서 무음 발화 한 번으로 소리를 깨워 둔다 */
function primeSpeech() {
  try {
    if (!isSpeechSupported()) return;
    const utter = new SpeechSynthesisUtterance(' ');
    utter.volume = 0;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

   6초 조작 없음 → 정답 반짝임 / 오답 2회 또는 12초 → "여기예요" */
function clearHintTimers() {
  if (blinkTimer) { clearTimeout(blinkTimer); blinkTimer = null; }
  if (hereTimer) { clearTimeout(hereTimer); hereTimer = null; }
  document.querySelectorAll('.hint-blink').forEach(el => el.classList.remove('hint-blink'));
  document.querySelectorAll('.here-hint').forEach(el => el.remove());
  document.querySelectorAll('.here-anchor').forEach(el => el.classList.remove('here-anchor'));
}

/* 조작이 있을 때마다 다시 6초/12초를 센다 */
function armHintTimers() {
  clearHintTimers();
  if (soloMode || demoMode) return; // 혼자 해보기·체험: 힌트 없음
  blinkTimer = setTimeout(showBlinkHint, 6000);
  hereTimer = setTimeout(showHereHint, 12000);
}

/* 지금 단계에서 반짝여야 할 곳 찾기 */
function getHintTarget() {
  const step = getCurrentStep();
  if (!step) return null;
  const body = document.getElementById('kiosk-body');
  if (step.layout === 'keypad') {
    // 다 입력했으면 [확인], 아직이면 숫자판 전체를 가리킨다
    if (keypadValue.length === step.digits) return body.querySelector('[data-ok]');
    return body.querySelector('.keypad-grid');
  }
  return body.querySelector('[data-correct]') || body.querySelector('[data-ok]');
}

function showBlinkHint() {
  const target = getHintTarget();
  if (!target) return;
  target.classList.add('hint-blink');
  hintShownThisStep = true;
}

function showHereHint() {
  const target = getHintTarget();
  if (!target || target.querySelector('.here-hint')) return;
  hintShownThisStep = true;
  target.classList.add('here-anchor');
  const badge = document.createElement('span');
  badge.className = 'here-hint';
  badge.textContent = TEXT.hereHint;
  target.appendChild(badge);
}

/* ===== 어려운 말 풀이 =====
   키오스크 안 글자 중 사전에 있는 말에 밑줄을 긋는다.
   (혼자 해보기·체험에서는 도움이므로 긋지 않는다) */
function glossaryRegex() {
  // 긴 말 먼저, 글자 사이 띄어쓰기 허용 ("본인 확인"도 "본인확인"으로 인정)
  const terms = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length);
  return new RegExp(terms.map(t => t.split('').join('\\s?')).join('|'), 'g');
}

function decorateGlossary(root) {
  if (soloMode || demoMode) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach(node => {
    // 정답 버튼 안에는 긋지 않는다: 정답을 누를 때마다 말풍선이 뜨면
    // 주 진행이 방해받는다. 뜻 배우기는 오답 버튼·제목·안내문으로 충분하다.
    const btn = node.parentElement && node.parentElement.closest('button');
    if (btn && (btn.hasAttribute('data-correct') || btn.hasAttribute('data-ok'))) return;
    const text = node.nodeValue;
    const re = glossaryRegex();
    let match, last = 0, found = false;
    const frag = document.createDocumentFragment();
    while ((match = re.exec(text))) {
      found = true;
      frag.appendChild(document.createTextNode(text.slice(last, match.index)));
      const span = document.createElement('span');
      span.className = 'gloss';
      span.textContent = match[0];
      span.dataset.term = match[0].replace(/\s/g, '');
      frag.appendChild(span);
      last = match.index + match[0].length;
    }
    if (!found) return;
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* 말풍선 열기: 연습은 그대로 이어진다 (버튼 동작을 막지 않는다) */
function openGloss(term) {
  const entry = GLOSSARY[term];
  if (!entry) return;
  document.getElementById('gloss-word').textContent = term;
  document.getElementById('gloss-easy').textContent = entry.easy;
  document.getElementById('gloss-detail').textContent = entry.detail;
  document.getElementById('gloss-bubble').classList.add('open');
  document.getElementById('gloss-bubble').dataset.term = term;
  if (!learnedTerms.includes(term)) learnedTerms.push(term);
}

function closeGloss() {
  document.getElementById('gloss-bubble').classList.remove('open');
}

function listenGloss() {
  const term = document.getElementById('gloss-bubble').dataset.term;
  const entry = GLOSSARY[term];
  if (entry) speak(term + '. ' + entry.easy + ' ' + entry.detail);
}

/* 오답 공통 처리: 힌트 글 + 음성 + 횟수 세기
   혼자 해보기에서는 아무 반응 없이 화면만 그대로 둔다 (탓하지 않는다) */
function handleWrong(step) {
  wrongCount++;
  if (soloMode || demoMode) return;
  setGuide(step.wrongHint, true);
  speak(step.wrongHint);
  armHintTimers();
  if (wrongCount >= 2) showHereHint();
}

  practice.classList.remove('solo');
  practice.classList.add('demo');
  showScreen('screen-practice');
  renderStep();
  // 15초 카운트다운 + 5초마다 1명씩 늘어나는 줄
  demoCountdown = 15;
  demoQueue = 3;
  updateDemoTimer();
  updateDemoQueue();
  demoTimerId = setInterval(tickDemoTimer, 1000);
  demoQueueTimerId = setInterval(growDemoQueue, 5000);
}

function tickDemoTimer() {
  demoCountdown--;
  updateDemoTimer();
  if (demoCountdown <= 0) endDemo(); // 시간이 다 되면 전환 화면으로
}

function updateDemoTimer() {
  const el = document.getElementById('demo-timer');
  el.textContent = TEXT.demoSeconds(Math.max(0, demoCountdown));
  el.classList.toggle('urgent', demoCountdown <= 5); // 5초부터 커지고 깜빡임
}

function growDemoQueue() {
  demoQueue++;
  updateDemoQueue();
}

function updateDemoQueue() {
  const el = document.getElementById('demo-queue');
  el.textContent = '';
  const icons = document.createElement('div');
  icons.className = 'queue-icons';
  icons.textContent = '👤'.repeat(demoQueue);
  el.appendChild(icons);
  el.appendChild(document.createTextNode(TEXT.demoQueue(demoQueue)));
}

/* 체험 모드 시계를 전부 끈다 (누수 방지) */
function stopDemo() {
  if (demoTimerId) { clearInterval(demoTimerId); demoTimerId = null; }
  if (demoQueueTimerId) { clearInterval(demoQueueTimerId); demoQueueTimerId = null; }
  demoMode = false;
  document.getElementById('screen-practice').classList.remove('demo');
}

/* 시간 초과 또는 3단계 완료 → 전환 화면 */
function endDemo() {
  stopDemo();
  showScreen('screen-demo-end');
}

/* 연습하기 / 혼자 해보기 고르기 */
function setMode(solo) {
  soloMode = solo;
  document.getElementById('btn-mode-practice').classList.toggle('selected', !solo);
  document.getElementById('btn-mode-solo').classList.toggle('selected', solo);
}

/* ===== 도우미 영역 문구 ===== */
function setGuide(text, isWrong) {
  const el = document.getElementById('guide-text');
  el.textContent = text;
  el.classList.toggle('wrong', !!isWrong);
}

/* 다시 듣기: 안내 문구를 다시 보여주고 다시 읽어준다 */
function repeatGuide() {
  const step = getCurrentStep();
  if (!step) return;
  setGuide(step.guide, false);
  speak(step.guide);
  armHintTimers();
}

function getCurrentStep() {
  if (!currentScenarioKey) return null;
  return SCENARIOS[currentScenarioKey].steps[currentStepIndex];
}

/* ===== 단계별 기록 (메모리에만) ===== */
function recordCurrentStep() {
  stepRecords.push({
    seconds: Math.round((Date.now() - stepStartAt) / 100) / 10, // 0.1초 단위
    wrong: wrongCount,
    hintShown: hintShownThisStep
  });
}

/* ===== 단계 진행 ===== */
function goNextStep() {
  recordCurrentStep(); // 방금 끝낸 단계를 기록하고 넘어간다
  // 체험 모드는 3단계까지만 하고 전환 화면으로 간다
  if (demoMode && currentStepIndex >= 2) {
    endDemo();
    return;
  }
  const steps = SCENARIOS[currentScenarioKey].steps;
  if (currentStepIndex < steps.length - 1) {
    currentStepIndex++;
    keypadValue = '';
    renderStep();
  } else {
    showComplete();
  }
}

/* 선택 버튼을 눌렀을 때: 맞으면 다음, 틀리면 힌트만 (화면은 그대로) */
function onOptionClick(option, step) {
  if (option.correct) {
    goNextStep();
  } else {
    handleWrong(step);
  }
}

/* ===== 범용 렌더러: 데이터를 읽어 키오스크 화면을 그린다 ===== */
function renderStep() {
  const scenario = SCENARIOS[currentScenarioKey];
  const step = scenario.steps[currentStepIndex];
  const total = scenario.steps.length;

  // 단계가 바뀔 때: 틀린 횟수 초기화 + 이전 타이머 전부 해제 (누수 방지)
  wrongCount = 0;
  hintShownThisStep = false;
  stepStartAt = Date.now();
  clearHintTimers();

  // 진행 표시 + 키오스크 머리글 + 도우미 안내
  document.getElementById('progress-bar').textContent =
    TEXT.progress(currentStepIndex + 1, total);
  document.getElementById('kiosk-header').textContent = scenario.title;
  setGuide(step.guide, false);

  // 키오스크 본문 새로 그리기
  const body = document.getElementById('kiosk-body');
  body.textContent = '';

  const title = document.createElement('div');
  title.id = 'kiosk-title';
  title.textContent = step.kioskTitle;
  body.appendChild(title);

  if (step.layout === 'grid' || step.layout === 'list' || step.layout === 'confirm') {
    if (step.message) {
      const msg = document.createElement('div');
      msg.className = 'kiosk-message';
      msg.textContent = step.message;
      body.appendChild(msg);
    }
    const wrap = document.createElement('div');
    wrap.className = (step.layout === 'grid') ? 'kiosk-grid' : 'kiosk-list';
    step.options.forEach(option => {
      const btn = document.createElement('button');
      btn.className = 'kiosk-btn';
      btn.textContent = option.label;
      if (option.correct) btn.setAttribute('data-correct', '1'); // 힌트가 가리킬 곳
      btn.addEventListener('click', () => onOptionClick(option, step));
      wrap.appendChild(btn);
    });
    body.appendChild(wrap);

  } else if (step.layout === 'keypad') {
    renderKeypad(body, step);

  } else if (step.layout === 'done') {
    const msg = document.createElement('div');
    msg.className = 'kiosk-message';
    msg.textContent = step.message;
    body.appendChild(msg);
    const btn = document.createElement('button');
    btn.className = 'kiosk-btn';
    btn.textContent = TEXT.doneOk;
    btn.setAttribute('data-ok', '1');
    btn.addEventListener('click', goNextStep);
    body.appendChild(btn);
  }

  // 어려운 말에 밑줄 긋기 (연습하기에서만)
  decorateGlossary(body);

  // 새 단계: 안내를 읽어주고 힌트 시계를 새로 켠다
  speak(step.guide);
  armHintTimers();
}

/* 숫자판 그리기 */
function renderKeypad(body, step) {
  const display = document.createElement('div');
  display.className = 'keypad-display';
  display.id = 'keypad-display';
  body.appendChild(display);
  updateKeypadDisplay();

  const grid = document.createElement('div');
  grid.className = 'keypad-grid';
  const keys = ['1','2','3','4','5','6','7','8','9', TEXT.keypadClear, '0', TEXT.keypadOk];
  keys.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'kiosk-btn';
    btn.textContent = key;
    if (key === TEXT.keypadClear) {
      btn.addEventListener('click', () => {
        // 지우기: 마지막 한 자리를 지운다
        keypadValue = keypadValue.slice(0, -1);
        updateKeypadDisplay();
        armHintTimers(); // 조작이 있었으니 힌트 시계 다시 시작
      });
    } else if (key === TEXT.keypadOk) {
      btn.setAttribute('data-ok', '1'); // 다 입력했을 때 힌트가 가리킬 곳
      btn.addEventListener('click', () => {
        // 자릿수를 다 채웠을 때만 다음 단계로
        if (keypadValue.length === step.digits) {
          goNextStep();
        } else {
          handleWrong(step);
        }
      });
    } else {
      btn.addEventListener('click', () => {
        // 자릿수를 넘으면 더 입력되지 않는다
        if (keypadValue.length < step.digits) {
          keypadValue += key;
          updateKeypadDisplay();
        }
        armHintTimers(); // 조작이 있었으니 힌트 시계 다시 시작
      });
    }
    grid.appendChild(btn);
  });
  body.appendChild(grid);
}

function updateKeypadDisplay() {
  const el = document.getElementById('keypad-display');
  if (el) el.textContent = keypadValue;
}

/* ===== 결과 카드 =====
   어려웠던 곳: 걸린 시간이 평균의 1.8배 이상이거나 오답 1회 이상 */
function findHardSteps() {
  if (stepRecords.length === 0) return [];
  const avg = stepRecords.reduce((sum, r) => sum + r.seconds, 0) / stepRecords.length;
  return stepRecords.map((r, i) =>
    (r.seconds >= avg * 1.8 || r.wrong >= 1) ? i : -1
  ).filter(i => i >= 0);
}

function formatSeconds(sec) {
  // 화면 표시용: 1초 미만도 1초로 보여준다 (0초는 어색해서)
  return TEXT.secondsLabel(Math.max(1, Math.round(sec)));
}

function buildResultCard() {
  const scenario = SCENARIOS[currentScenarioKey];
  const hardSteps = findHardSteps();

  // 총 시간: "총 O분 O초 만에 끝냈어요"
  const totalSec = Math.max(1, Math.round(stepRecords.reduce((s, r) => s + r.seconds, 0)));
  document.getElementById('total-time').textContent =
    TEXT.totalTime(Math.floor(totalSec / 60), totalSec % 60);

  // 단계별 걸린 시간 막대 (CSS만 사용)
  const chart = document.getElementById('result-chart');
  chart.textContent = '';
  const maxSec = Math.max(...stepRecords.map(r => r.seconds), 1);
  stepRecords.forEach((r, i) => {
    const row = document.createElement('div');
    row.className = 'chart-row';

    const label = document.createElement('div');
    label.className = 'chart-label';
    label.textContent = TEXT.stepLabel(i + 1);
    row.appendChild(label);

    const track = document.createElement('div');
    track.className = 'chart-track';
    const bar = document.createElement('div');
    bar.className = 'chart-bar' + (hardSteps.includes(i) ? ' hard' : '');
    bar.style.width = Math.max(6, Math.round(r.seconds / maxSec * 100)) + '%';
    track.appendChild(bar);
    row.appendChild(track);

    const sec = document.createElement('div');
    sec.className = 'chart-sec';
    sec.textContent = formatSeconds(r.seconds);
    row.appendChild(sec);

    chart.appendChild(row);
  });

  // 어려웠던 단계의 tip → "다음엔 이렇게 하세요"
  const tips = document.getElementById('result-tips');
  tips.textContent = '';
  const tipsTitle = document.createElement('div');
  tipsTitle.className = 'result-section-title';
  tipsTitle.textContent = TEXT.tipsTitle;
  tips.appendChild(tipsTitle);
  if (hardSteps.length === 0) {
    const line = document.createElement('div');
    line.className = 'tip-line';
    line.textContent = TEXT.noHardSteps;
    tips.appendChild(line);
  } else {
    hardSteps.forEach(i => {
      const line = document.createElement('div');
      line.className = 'tip-line';
      const where = document.createElement('strong');
      where.textContent = TEXT.stepLabel(i + 1) + ' ';
      line.appendChild(where);
      line.appendChild(document.createTextNode(scenario.steps[i].tip));
      tips.appendChild(line);
    });
  }

  // 오늘 새로 배운 말 (뜻을 찾아본 게 있을 때만)
  if (learnedTerms.length > 0) {
    const learnedTitle = document.createElement('div');
    learnedTitle.className = 'result-section-title';
    learnedTitle.style.marginTop = '16px';
    learnedTitle.textContent = TEXT.learnedTitle;
    tips.appendChild(learnedTitle);
    learnedTerms.forEach(term => {
      const line = document.createElement('div');
      line.className = 'tip-line';
      const word = document.createElement('strong');
      word.textContent = term + ' ';
      line.appendChild(word);
      line.appendChild(document.createTextNode('— ' + GLOSSARY[term].easy));
      tips.appendChild(line);
    });
  }
}

/* ===== 우리 부모님 맞춤 순서표 (인쇄용 A4 한 장) ===== */
function buildPrintSheet() {
  const scenario = SCENARIOS[currentScenarioKey];
  const hardSteps = findHardSteps();

  const sheet = document.getElementById('print-sheet');
  sheet.textContent = '';

  const title = document.createElement('h1');
  title.textContent = scenario.title + TEXT.sheetTitleSuffix;
  sheet.appendChild(title);

  const sub = document.createElement('div');
  sub.className = 'sheet-sub';
  sub.textContent = TEXT.sheetSub;
  sheet.appendChild(sub);

  const list = document.createElement('ol');
  scenario.steps.forEach((step, i) => {
    const item = document.createElement('li');
    item.appendChild(document.createTextNode(step.tip));
    if (hardSteps.includes(i)) {
      // 어려웠던 단계: 굵게 + 조심 표시
      item.className = 'hard';
      const care = document.createElement('span');
      care.className = 'care';
      care.textContent = TEXT.careMark;
      item.appendChild(care);
    }
    list.appendChild(item);
  });
  sheet.appendChild(list);
}

function printSheet() {
  try { window.print(); } catch (e) { /* 인쇄가 막혀도 앱은 깨지지 않는다 */ }
}

/* ===== 처음 한 번: 고정 문구 채우고 버튼 연결 ===== */
function initApp() {
  document.getElementById('home-title').textContent = TEXT.appTitle;
  document.getElementById('home-guide').textContent = TEXT.homeGuide;

  const hospitalCard = document.getElementById('card-hospital');
  hospitalCard.textContent = TEXT.hospitalCard;
  const hospitalSub = document.createElement('span');
  hospitalSub.className = 'card-sub';
  hospitalSub.textContent = TEXT.hospitalCardSub;
  hospitalCard.appendChild(hospitalSub);
  hospitalCard.addEventListener('click', () => startScenario('hospital'));

  const cafeCard = document.getElementById('card-cafe');
  cafeCard.textContent = TEXT.cafeCard;
  const cafeSub = document.createElement('span');
  cafeSub.className = 'card-sub';
  cafeSub.textContent = TEXT.cafeCardSub;
  cafeCard.appendChild(cafeSub);
  cafeCard.addEventListener('click', () => startScenario('cafe'));

  // 체험 모드: 심사위원·가족이 어르신의 답답함을 직접 느껴보는 문
  const demoCard = document.getElementById('card-demo');
  demoCard.textContent = TEXT.demoCard;
  const demoSub = document.createElement('span');
  demoSub.className = 'card-sub';
  demoSub.textContent = TEXT.demoCardSub;
  demoCard.appendChild(demoSub);
  demoCard.addEventListener('click', startDemo);

  document.getElementById('demo-end-line1').textContent = TEXT.demoEndLine1;
  document.getElementById('demo-end-line2').textContent = TEXT.demoEndLine2;
  document.getElementById('demo-end-line3').textContent = TEXT.demoEndLine3;
  const demoEndBtn = document.getElementById('btn-demo-end');
  demoEndBtn.textContent = TEXT.demoEndBtn;
  demoEndBtn.addEventListener('click', () => { setMode(false); goHome(); });

  // 연습하기 / 혼자 해보기 (기본: 연습하기)
  document.getElementById('mode-question').textContent = TEXT.modeQuestion;
  const modePracticeBtn = document.getElementById('btn-mode-practice');
  modePracticeBtn.textContent = TEXT.modePractice;
  modePracticeBtn.addEventListener('click', () => setMode(false));
  const modeSoloBtn = document.getElementById('btn-mode-solo');
  modeSoloBtn.textContent = TEXT.modeSolo;
  modeSoloBtn.addEventListener('click', () => setMode(true));
  setMode(false);

  document.getElementById('btn-repeat').textContent = TEXT.repeatBtn;
  document.getElementById('btn-repeat').addEventListener('click', repeatGuide);
  document.getElementById('btn-home').textContent = TEXT.homeBtn;
  document.getElementById('btn-home').addEventListener('click', goHome);

  document.getElementById('complete-title').textContent = TEXT.completeTitle;
  document.getElementById('chart-title').textContent = TEXT.chartTitle;
  const printBtn = document.getElementById('btn-print');
  printBtn.textContent = TEXT.printBtn;
  printBtn.addEventListener('click', printSheet);
  const retryBtn = document.getElementById('btn-retry');
  retryBtn.textContent = TEXT.retryBtn;
  // 방금 한 시나리오를 같은 방식으로 다시 한다
  retryBtn.addEventListener('click', () => startScenario(currentScenarioKey || 'hospital'));

  // 어려운 말 풀이: 키오스크 안 밑줄 단어를 누르면 말풍선
  document.getElementById('kiosk-area').addEventListener('click', e => {
    const gloss = e.target.closest('.gloss');
    if (gloss) openGloss(gloss.dataset.term);
  });
  const glossListenBtn = document.getElementById('btn-gloss-listen');
  glossListenBtn.textContent = TEXT.glossListen;
  glossListenBtn.addEventListener('click', listenGloss);
  const glossCloseBtn = document.getElementById('btn-gloss-close');
  glossCloseBtn.textContent = TEXT.glossClose;
  glossCloseBtn.addEventListener('click', closeGloss);

  // 소리 켜기/끄기 (기본 켜짐)
  updateSoundButton();
  document.getElementById('btn-sound').addEventListener('click', toggleSound);

  // 글씨 크기 3단계 (기본: 보통)
  const sizeIds = ['btn-size-small', 'btn-size-mid', 'btn-size-large'];
  const sizeLabels = [TEXT.sizeSmall, TEXT.sizeMid, TEXT.sizeLarge];
  sizeIds.forEach((id, i) => {
    const btn = document.getElementById(id);
    btn.textContent = sizeLabels[i];
    btn.addEventListener('click', () => setScale(i));
  });
  setScale(0);

  // 첫 사용자 조작(홈 화면 첫 클릭 포함)에서 무음 발화로 소리를 깨워 둔다
  document.addEventListener('click', primeSpeech, { once: true });

  // 음성 목록이 늦게 도착해도 다시 고른다 (미지원이면 조용히 넘어감)
  try {
    if (isSpeechSupported()) {
      window.speechSynthesis.addEventListener('voiceschanged', pickKoreanVoice);
      pickKoreanVoice();
    }
  } catch (e) {}
}

initApp();
</script>
