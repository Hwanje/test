<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키오스크 연습장</title>
<style>
  /* ===== 디자인 시스템 (CLAUDE.md 수치 고정) ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 22px;               /* 본문 */
    color: #1A1A1A;
    background: #FFFFFF;
  }
  button {
    font-family: inherit;
    color: #1A1A1A;
    min-height: 80px;              /* 버튼 최소 높이 */
    border-radius: 16px;           /* 모서리 */
    cursor: pointer;
  }

  /* ===== 화면 전환 ===== */
  .screen { display: none; height: 100%; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== 소리 켜기/끄기 (모든 화면 우측 상단) ===== */
  #btn-sound {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    font-size: 22px; font-weight: 700; padding: 0 20px;
    background: #FFFFFF; color: #1F6FEB; border: 3px solid #1F6FEB;
  }

  /* ===== 힌트 (허용된 유일한 애니메이션: 힌트 반짝임) ===== */
  @keyframes hintBlink {
    0%, 100% { box-shadow: 0 0 0 0 rgba(31, 111, 235, 0); }
    50%      { box-shadow: 0 0 0 8px rgba(31, 111, 235, 0.55); }
  }
  .hint-blink {
    animation: hintBlink 1.2s ease-in-out infinite;
    border-color: #1F6FEB !important;
  }
  .here-anchor { position: relative; }
  .here-hint {
    position: absolute; top: 4px; right: 4px;
    background: #1F6FEB; color: #FFFFFF;
    font-size: 22px; font-weight: 700;
    padding: 4px 12px; border-radius: 16px;
    pointer-events: none;
  }

  /* ===== 홈 화면 (바깥 = 배려: 크고 친절하게) ===== */
  #screen-home { padding: 112px 24px 24px; gap: 16px; }
  #screen-home h1 { font-size: 38px; text-align: center; margin: 24px 0 8px; }
  #screen-home p  { text-align: center; margin-bottom: 16px; }
  .home-card {
    display: block; width: 100%; min-height: 160px;
    font-size: 28px; font-weight: 700;
    background: #FFFFFF; border: 3px solid #1F6FEB; color: #1F6FEB;
  }
  .home-card:disabled {
    border-color: #767676; color: #767676; cursor: default;
  }
  .home-card .card-sub { display: block; font-size: 22px; font-weight: 400; margin-top: 8px; }

  /* ===== 연습 화면 ===== */
  #screen-practice { height: 100%; }
  /* 상단 진행 표시 */
  #progress-bar {
    min-height: 96px; display: flex; align-items: center;
    padding: 8px 200px 8px 24px;      /* 우측은 소리 단추 자리 */
    font-size: 22px; font-weight: 700;
    background: #FFFFFF; border-bottom: 2px solid #1A1A1A;
  }

  /* --- 안쪽 = 현실 재현: 실제 키오스크처럼 무뚝뚝하고 빽빽하게 --- */
  #kiosk-area {
    flex: 2; overflow-y: auto;
    background: #FFFFFF;
    padding: 16px 24px;
    display: flex; flex-direction: column;
  }
  #kiosk-frame {
    flex: 1; display: flex; flex-direction: column;
    border: 4px solid #1A1A1A; border-radius: 16px; overflow: hidden;
  }
  #kiosk-header {
    background: #1A1A1A; color: #FFFFFF;
    font-size: 22px; padding: 10px 16px;
  }
  #kiosk-body { flex: 1; padding: 16px; overflow-y: auto; }
  #kiosk-title { font-size: 28px; font-weight: 700; margin-bottom: 16px; }
  .kiosk-btn {
    font-size: 28px;               /* 키오스크 버튼 */
    background: #FFFFFF; border: 2px solid #1A1A1A;
    width: 100%;
  }
  .kiosk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .kiosk-list { display: flex; flex-direction: column; gap: 16px; }
  /* 숫자판 */
  .keypad-display {
    font-size: 38px; letter-spacing: 8px; text-align: center;
    border: 2px solid #1A1A1A; border-radius: 16px;
    min-height: 80px; line-height: 76px; margin-bottom: 16px;
  }
  .keypad-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  /* 확인/완료 안내문 */
  .kiosk-message { font-size: 28px; line-height: 1.5; margin-bottom: 16px; }

  /* --- 바깥 = 배려: 도우미 영역 --- */
  #helper-area {
    flex: 1; display: flex; flex-direction: column;
    padding: 16px 24px; gap: 16px;
    border-top: 4px solid #1F6FEB;
    background: #FFFFFF;
  }
  #guide-text {
    flex: 1; font-size: 26px;      /* 도우미 안내 */
    line-height: 1.5; color: #1F6FEB; font-weight: 700;
  }
  #guide-text.wrong { color: #C2410C; } /* 주의색: 틀렸을 때 힌트 */
  .helper-buttons { display: flex; gap: 16px; }
  .helper-btn {
    flex: 1; font-size: 26px; font-weight: 700;
    background: #1F6FEB; color: #FFFFFF; border: none;
  }
  .helper-btn.secondary {
    background: #FFFFFF; color: #1F6FEB; border: 3px solid #1F6FEB;
  }

  /* ===== 완료 화면 ===== */
  #screen-complete {
    justify-content: center; align-items: center;
    padding: 24px; gap: 16px; text-align: center;
  }
  #screen-complete h1 { font-size: 38px; color: #0F7B3E; }
  #screen-complete button {
    width: 100%; max-width: 480px; font-size: 28px; font-weight: 700;
    background: #1F6FEB; color: #FFFFFF; border: none;
  }
</style>
</head>
<body>

<!-- 소리 켜기/끄기 (모든 화면 공통) -->
<button id="btn-sound"></button>

<!-- 홈 화면 -->
<div id="screen-home" class="screen active">
  <h1 id="home-title"></h1>
  <p id="home-guide"></p>
  <button id="card-hospital" class="home-card"></button>
  <button id="card-cafe" class="home-card" disabled></button>
</div>

<!-- 연습 화면 -->
<div id="screen-practice" class="screen">
  <div id="progress-bar"></div>
  <div id="kiosk-area">
    <div id="kiosk-frame">
      <div id="kiosk-header"></div>
      <div id="kiosk-body"></div>
    </div>
  </div>
  <div id="helper-area">
    <div id="guide-text"></div>
    <div class="helper-buttons">
      <button id="btn-repeat" class="helper-btn"></button>
      <button id="btn-home" class="helper-btn secondary"></button>
    </div>
  </div>
</div>

<!-- 완료 화면 -->
<div id="screen-complete" class="screen">
  <h1 id="complete-title"></h1>
  <button id="btn-retry"></button>
</div>

<script>
'use strict';

/* ===== 사용자에게 보이는 모든 공통 문구 ===== */
const TEXT = {
  appTitle: '키오스크 연습장',
  homeGuide: '연습할 것을 골라 주세요.',
  hospitalCard: '병원 접수',
  hospitalCardSub: '무인 접수기 연습',
  cafeCard: '카페 주문',
  cafeCardSub: '준비 중',
  progress: (now, total) => now + ' / ' + total + ' 단계',
  repeatBtn: '다시 듣기',
  homeBtn: '처음으로',
  keypadClear: '지우기',
  keypadOk: '확인',
  doneOk: '확인',
  completeTitle: '잘하셨어요',
  retryBtn: '다시 하기',
  soundOffBtn: '소리 끄기',   /* 켜져 있을 때 누르면 꺼짐 */
  soundOnBtn: '소리 켜기',    /* 꺼져 있을 때 누르면 켜짐 */
  hereHint: '여기예요'
};

/* ===== 시나리오 데이터 (새 시나리오는 여기에 데이터만 추가) ===== */
const SCENARIOS = {
  hospital: {
    title: '병원 무인 접수기',
    steps: [
      {
        layout: 'grid',
        kioskTitle: '무엇을 도와드릴까요?',
        guide: '병원에 왔으니 먼저 접수를 해요. "접수"를 눌러주세요.',
        options: [
          { label: '접수', correct: true },
          { label: '수납' },
          { label: '증명서 발급' },
          { label: '건강검진' }
        ],
        wrongHint: '그건 진료가 끝난 뒤에 누르는 거예요. 지금은 "접수"를 눌러요.'
      },
      {
        layout: 'grid',
        kioskTitle: '본인 확인 방법을 선택하세요',
        guide: '이번에는 주민등록번호로 해볼게요. "주민등록번호"를 눌러주세요.',
        options: [
          { label: '주민등록번호', correct: true },
          { label: '휴대폰번호' }
        ],
        wrongHint: '괜찮아요. 이번 연습은 "주민등록번호"로 해요.'
      },
      {
        layout: 'keypad',
        kioskTitle: '생년월일 앞 6자리를 입력하세요',
        guide: '생년월일 여섯 자리를 눌러요. 예: 480312',
        digits: 6,
        wrongHint: '괜찮아요. 여섯 자리를 다 누른 뒤 "확인"을 눌러요.'
      },
      {
        layout: 'list',
        kioskTitle: '진료과를 선택하세요',
        guide: '오늘은 감기 때문에 왔어요. "내과"를 눌러주세요.',
        options: [
          { label: '내과', correct: true },
          { label: '정형외과' },
          { label: '안과' },
          { label: '피부과' },
          { label: '신경과' }
        ],
        wrongHint: '감기는 내과에서 봐요. "내과"를 눌러주세요.'
      },
      {
        layout: 'confirm',
        kioskTitle: '예약 내용을 확인하세요',
        message: '김순자 님, 내과 오전 10시 30분 맞습니까?',
        guide: '내용이 맞는지 보고 "예"를 눌러주세요.',
        options: [
          { label: '예', correct: true },
          { label: '아니오' }
        ],
        wrongHint: '괜찮아요. 연습이니 내용이 맞아요. "예"를 눌러주세요.'
      },
      {
        layout: 'done',
        kioskTitle: '접수 완료',
        message: '접수가 끝났습니다. 대기번호 23번. 3층 내과 앞에서 기다려 주세요.',
        guide: '접수가 다 됐어요! "확인"을 누르면 끝나요.'
      }
    ]
  }
};

/* ===== 상태 (전부 메모리) ===== */
let currentScenarioKey = null;   // 지금 연습 중인 시나리오
let currentStepIndex = 0;        // 지금 단계 번호 (0부터)
let keypadValue = '';            // 숫자판 입력값
let soundOn = true;              // 소리 기본 켜짐
let koreanVoice = null;          // 고른 한국어 음성
let wrongCount = 0;              // 이 단계에서 틀린 횟수
let blinkTimer = null;           // 6초 반짝임 타이머
let hereTimer = null;            // 12초 "여기예요" 타이머

/* ===== 음성 안내 (지원 안 되면 조용히 넘어가고 글만 보여준다) ===== */
function isSpeechSupported() {
  return typeof window !== 'undefined'
    && 'speechSynthesis' in window
    && typeof SpeechSynthesisUtterance !== 'undefined';
}

/* 한국어 음성 고르기: 기기에 내장된(localService) 음성 우선 */
function pickKoreanVoice() {
  try {
    const voices = window.speechSynthesis.getVoices();
    const korean = voices.filter(v =>
      (v.lang || '').replace('_', '-').toLowerCase().indexOf('ko') === 0);
    koreanVoice = korean.find(v => v.localService) || korean[0] || null;
  } catch (e) {
    koreanVoice = null;
  }
}

function speak(text) {
  if (!soundOn || !isSpeechSupported()) return;
  try {
    if (!koreanVoice) pickKoreanVoice();
    if (!koreanVoice) return;   // 한국어 음성이 없으면 글만 보여준다
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.voice = koreanVoice;
    utter.lang = 'ko-KR';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  } catch (e) { /* 어떤 경우에도 소리 때문에 앱이 깨지지 않는다 */ }
}

function stopSpeech() {
  try { if (isSpeechSupported()) window.speechSynthesis.cancel(); } catch (e) {}
}

/* 첫 사용자 조작에서 무음 발화 한 번으로 소리를 깨워 둔다 */
function primeSpeech() {
  try {
    if (!isSpeechSupported()) return;
    const utter = new SpeechSynthesisUtterance(' ');
    utter.volume = 0;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

function toggleSound() {
  soundOn = !soundOn;
  if (!soundOn) stopSpeech();
  updateSoundButton();
}

function updateSoundButton() {
  document.getElementById('btn-sound').textContent =
    soundOn ? TEXT.soundOffBtn : TEXT.soundOnBtn;
}

/* ===== 힌트 3단계 =====
   6초 조작 없음 → 정답 반짝임 / 오답 2회 또는 12초 → "여기예요" */
function clearHintTimers() {
  if (blinkTimer) { clearTimeout(blinkTimer); blinkTimer = null; }
  if (hereTimer) { clearTimeout(hereTimer); hereTimer = null; }
  document.querySelectorAll('.hint-blink').forEach(el => el.classList.remove('hint-blink'));
  document.querySelectorAll('.here-hint').forEach(el => el.remove());
  document.querySelectorAll('.here-anchor').forEach(el => el.classList.remove('here-anchor'));
}

/* 조작이 있을 때마다 다시 6초/12초를 센다 */
function armHintTimers() {
  clearHintTimers();
  blinkTimer = setTimeout(showBlinkHint, 6000);
  hereTimer = setTimeout(showHereHint, 12000);
}

/* 지금 단계에서 반짝여야 할 곳 찾기 */
function getHintTarget() {
  const step = getCurrentStep();
  if (!step) return null;
  const body = document.getElementById('kiosk-body');
  if (step.layout === 'keypad') {
    // 다 입력했으면 [확인], 아직이면 숫자판 전체를 가리킨다
    if (keypadValue.length === step.digits) return body.querySelector('[data-ok]');
    return body.querySelector('.keypad-grid');
  }
  return body.querySelector('[data-correct]') || body.querySelector('[data-ok]');
}

function showBlinkHint() {
  const target = getHintTarget();
  if (target) target.classList.add('hint-blink');
}

function showHereHint() {
  const target = getHintTarget();
  if (!target || target.querySelector('.here-hint')) return;
  target.classList.add('here-anchor');
  const badge = document.createElement('span');
  badge.className = 'here-hint';
  badge.textContent = TEXT.hereHint;
  target.appendChild(badge);
}

/* 오답 공통 처리: 힌트 글 + 음성 + 횟수 세기 */
function handleWrong(step) {
  wrongCount++;
  setGuide(step.wrongHint, true);
  speak(step.wrongHint);
  armHintTimers();
  if (wrongCount >= 2) showHereHint();
}

/* ===== 화면 전환 ===== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  clearHintTimers();
  stopSpeech();
  currentScenarioKey = null;
  currentStepIndex = 0;
  keypadValue = '';
  showScreen('screen-home');
}

function startScenario(key) {
  currentScenarioKey = key;
  currentStepIndex = 0;
  keypadValue = '';
  showScreen('screen-practice');
  renderStep();
}

function showComplete() {
  clearHintTimers();
  showScreen('screen-complete');
}

/* ===== 도우미 영역 문구 ===== */
function setGuide(text, isWrong) {
  const el = document.getElementById('guide-text');
  el.textContent = text;
  el.classList.toggle('wrong', !!isWrong);
}

/* 다시 듣기: 안내 문구를 다시 보여주고 다시 읽어준다 */
function repeatGuide() {
  const step = getCurrentStep();
  if (!step) return;
  setGuide(step.guide, false);
  speak(step.guide);
  armHintTimers();
}

function getCurrentStep() {
  if (!currentScenarioKey) return null;
  return SCENARIOS[currentScenarioKey].steps[currentStepIndex];
}

/* ===== 단계 진행 ===== */
function goNextStep() {
  const steps = SCENARIOS[currentScenarioKey].steps;
  if (currentStepIndex < steps.length - 1) {
    currentStepIndex++;
    keypadValue = '';
    renderStep();
  } else {
    showComplete();
  }
}

/* 선택 버튼을 눌렀을 때: 맞으면 다음, 틀리면 힌트만 (화면은 그대로) */
function onOptionClick(option, step) {
  if (option.correct) {
    goNextStep();
  } else {
    handleWrong(step);
  }
}

/* ===== 범용 렌더러: 데이터를 읽어 키오스크 화면을 그린다 ===== */
function renderStep() {
  const scenario = SCENARIOS[currentScenarioKey];
  const step = scenario.steps[currentStepIndex];
  const total = scenario.steps.length;

  // 단계가 바뀔 때: 틀린 횟수 초기화 + 이전 타이머 전부 해제 (누수 방지)
  wrongCount = 0;
  clearHintTimers();

  // 진행 표시 + 키오스크 머리글 + 도우미 안내
  document.getElementById('progress-bar').textContent =
    TEXT.progress(currentStepIndex + 1, total);
  document.getElementById('kiosk-header').textContent = scenario.title;
  setGuide(step.guide, false);

  // 키오스크 본문 새로 그리기
  const body = document.getElementById('kiosk-body');
  body.textContent = '';

  const title = document.createElement('div');
  title.id = 'kiosk-title';
  title.textContent = step.kioskTitle;
  body.appendChild(title);

  if (step.layout === 'grid' || step.layout === 'list' || step.layout === 'confirm') {
    if (step.message) {
      const msg = document.createElement('div');
      msg.className = 'kiosk-message';
      msg.textContent = step.message;
      body.appendChild(msg);
    }
    const wrap = document.createElement('div');
    wrap.className = (step.layout === 'grid') ? 'kiosk-grid' : 'kiosk-list';
    step.options.forEach(option => {
      const btn = document.createElement('button');
      btn.className = 'kiosk-btn';
      btn.textContent = option.label;
      if (option.correct) btn.setAttribute('data-correct', '1'); // 힌트가 가리킬 곳
      btn.addEventListener('click', () => onOptionClick(option, step));
      wrap.appendChild(btn);
    });
    body.appendChild(wrap);

  } else if (step.layout === 'keypad') {
    renderKeypad(body, step);

  } else if (step.layout === 'done') {
    const msg = document.createElement('div');
    msg.className = 'kiosk-message';
    msg.textContent = step.message;
    body.appendChild(msg);
    const btn = document.createElement('button');
    btn.className = 'kiosk-btn';
    btn.textContent = TEXT.doneOk;
    btn.setAttribute('data-ok', '1');
    btn.addEventListener('click', goNextStep);
    body.appendChild(btn);
  }

  // 새 단계: 안내를 읽어주고 힌트 시계를 새로 켠다
  speak(step.guide);
  armHintTimers();
}

/* 숫자판 그리기 */
function renderKeypad(body, step) {
  const display = document.createElement('div');
  display.className = 'keypad-display';
  display.id = 'keypad-display';
  body.appendChild(display);
  updateKeypadDisplay();

  const grid = document.createElement('div');
  grid.className = 'keypad-grid';
  const keys = ['1','2','3','4','5','6','7','8','9', TEXT.keypadClear, '0', TEXT.keypadOk];
  keys.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'kiosk-btn';
    btn.textContent = key;
    if (key === TEXT.keypadClear) {
      btn.addEventListener('click', () => {
        // 지우기: 마지막 한 자리를 지운다
        keypadValue = keypadValue.slice(0, -1);
        updateKeypadDisplay();
        armHintTimers(); // 조작이 있었으니 힌트 시계 다시 시작
      });
    } else if (key === TEXT.keypadOk) {
      btn.setAttribute('data-ok', '1'); // 다 입력했을 때 힌트가 가리킬 곳
      btn.addEventListener('click', () => {
        // 자릿수를 다 채웠을 때만 다음 단계로
        if (keypadValue.length === step.digits) {
          goNextStep();
        } else {
          handleWrong(step);
        }
      });
    } else {
      btn.addEventListener('click', () => {
        // 자릿수를 넘으면 더 입력되지 않는다
        if (keypadValue.length < step.digits) {
          keypadValue += key;
          updateKeypadDisplay();
        }
        armHintTimers(); // 조작이 있었으니 힌트 시계 다시 시작
      });
    }
    grid.appendChild(btn);
  });
  body.appendChild(grid);
}

function updateKeypadDisplay() {
  const el = document.getElementById('keypad-display');
  if (el) el.textContent = keypadValue;
}

/* ===== 처음 한 번: 고정 문구 채우고 버튼 연결 ===== */
function initApp() {
  document.getElementById('home-title').textContent = TEXT.appTitle;
  document.getElementById('home-guide').textContent = TEXT.homeGuide;

  const hospitalCard = document.getElementById('card-hospital');
  hospitalCard.textContent = TEXT.hospitalCard;
  const hospitalSub = document.createElement('span');
  hospitalSub.className = 'card-sub';
  hospitalSub.textContent = TEXT.hospitalCardSub;
  hospitalCard.appendChild(hospitalSub);
  hospitalCard.addEventListener('click', () => startScenario('hospital'));

  const cafeCard = document.getElementById('card-cafe');
  cafeCard.textContent = TEXT.cafeCard;
  const cafeSub = document.createElement('span');
  cafeSub.className = 'card-sub';
  cafeSub.textContent = TEXT.cafeCardSub;
  cafeCard.appendChild(cafeSub);

  document.getElementById('btn-repeat').textContent = TEXT.repeatBtn;
  document.getElementById('btn-repeat').addEventListener('click', repeatGuide);
  document.getElementById('btn-home').textContent = TEXT.homeBtn;
  document.getElementById('btn-home').addEventListener('click', goHome);

  document.getElementById('complete-title').textContent = TEXT.completeTitle;
  const retryBtn = document.getElementById('btn-retry');
  retryBtn.textContent = TEXT.retryBtn;
  retryBtn.addEventListener('click', () => startScenario('hospital'));

  // 소리 켜기/끄기 (기본 켜짐)
  updateSoundButton();
  document.getElementById('btn-sound').addEventListener('click', toggleSound);

  // 첫 사용자 조작(홈 화면 첫 클릭 포함)에서 무음 발화로 소리를 깨워 둔다
  document.addEventListener('click', primeSpeech, { once: true });

  // 음성 목록이 늦게 도착해도 다시 고른다 (미지원이면 조용히 넘어감)
  try {
    if (isSpeechSupported()) {
      window.speechSynthesis.addEventListener('voiceschanged', pickKoreanVoice);
      pickKoreanVoice();
    }
  } catch (e) {}
}

initApp();
</script>
